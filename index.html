<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana R. Correia - CV</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f0f0;
        }

        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .fallback-msg {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            text-align: center;
            color: #333;
        }

        .fallback-msg a {
            color: #0366d6;
            text-decoration: none;
            font-weight: bold;
        }
        
        .fallback-msg a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <iframe class="pdf-frame" src="AnaRCorreia.pdf" title="Embedded PDF Document">
        <object class="pdf-frame" data="AnaRCorreia.pdf" type="application/pdf">
            <div class="fallback-msg">
                <p>Your browser does not support embedded PDFs.</p>
                <p>You can <a href="AnaRCorreia.pdf" download>click here to download the PDF</a> instead.</p>
            </div>
        </object>
    </iframe>
</body>

</html>
